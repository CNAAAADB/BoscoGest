name: DEV - verify and deploy isolated environment

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: boscogest-development-deployment
  cancel-in-progress: false

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: bg
          POSTGRES_PASSWORD: bg
          POSTGRES_DB: boscogest
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: boscoGest-back
    env:
      DATABASE_URL: postgresql+psycopg2://bg:bg@localhost:5432/boscogest
      SECRET_KEY: ci-test-only-secret-key-of-at-least-thirty-two-characters
      CORS_ORIGINS: http://testserver
      STORAGE_BACKEND: local
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: boscoGest-back/requirements.txt
      - run: pip install -r requirements.txt
      - run: ruff check app/
      - run: python -m pytest app/tests/ -q
      - run: alembic upgrade head

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: boscoGest-front
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: boscoGest-front/package-lock.json
      - run: npm ci
      - name: Compile against DEV API only
        env:
          API_URL: https://api-dev.boscogest.com
          WS_URL: wss://api-dev.boscogest.com
        run: npm run build
      - name: Verify production API is absent from DEV bundles
        run: |
          test -s dist/boscoGest-front/browser/index.html
          if grep -rFl 'https://api.boscogest.com' dist/boscoGest-front/browser/*.js; then
            echo "DEV application unexpectedly references the production API" >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: boscogest-development-frontend
          path: boscoGest-front/dist/boscoGest-front/browser/
          if-no-files-found: error
          retention-days: 7

  backend-deploy:
    needs: [backend-tests, frontend-build]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: eu-west-1
          role-to-assume: arn:aws:iam::909186483504:role/BoscoGest-GitHub-Dev-Deployer
          role-session-name: boscogest-dev-${{ github.run_id }}
      - uses: aws-actions/amazon-ecr-login@v2
      - uses: docker/setup-buildx-action@v3
      - name: Build DEV backend image (no production image changes)
        env:
          IMAGE: 909186483504.dkr.ecr.eu-west-1.amazonaws.com/boscogest-back-dev:${{ github.sha }}
        run: docker buildx build --platform linux/amd64 --push -t "$IMAGE" boscoGest-back/
      - name: Deploy DEV backend through AWS SSM
        id: rollout
        env:
          IMAGE: 909186483504.dkr.ecr.eu-west-1.amazonaws.com/boscogest-back-dev:${{ github.sha }}
        run: |
          python3 - <<'PY'
          import json, os, shlex
          from pathlib import Path
          image = os.environ["IMAGE"]
          commands = """
          set -eu
          cd /opt/boscogest-dev
          test -s .env && test -s compose.yml
          previous="$(sed -n 's/^DEV_IMAGE=//p' .env | tail -1)"
          aws ecr get-login-password --region eu-west-1 | docker login --username AWS --password-stdin 909186483504.dkr.ecr.eu-west-1.amazonaws.com
          docker pull NEW_IMAGE_PLACEHOLDER
          sed -i '/^DEV_IMAGE=/d' .env
          echo 'DEV_IMAGE=NEW_IMAGE_PLACEHOLDER' >> .env
          if ! docker compose -f compose.yml up -d --no-deps back; then
            sed -i '/^DEV_IMAGE=/d' .env
            echo "DEV_IMAGE=$previous" >> .env
            exit 1
          fi
          cid="$(docker compose -f compose.yml ps -q back)"
          healthy=0
          for i in $(seq 1 36); do
            state="$(docker inspect -f '{{.State.Health.Status}}' "$cid" 2>/dev/null || true)"
            if [ "$state" = healthy ]; then healthy=1; break; fi
            sleep 5
          done
          if [ "$healthy" != 1 ]; then
            echo "DEV backend failed healthcheck" >&2
            sed -i '/^DEV_IMAGE=/d' .env
            echo "DEV_IMAGE=$previous" >> .env
            if [ "$previous" != "909186483504.dkr.ecr.eu-west-1.amazonaws.com/boscogest-back-dev:bootstrap" ]; then
              docker compose -f compose.yml up -d --no-deps back || true
            fi
            exit 1
          fi
          echo "DEV backend healthy"
          """
          commands = commands.replace("NEW_IMAGE_PLACEHOLDER", shlex.quote(image))
          Path("/tmp/dev-rollout.json").write_text(json.dumps({"commands":[commands]}))
          PY
          id="$(aws ssm send-command --instance-ids i-0e1aef4dd9cd5ee83 \
            --document-name AWS-RunShellScript \
            --comment "BoscoGest DEV ${{ github.sha }}" \
            --timeout-seconds 900 \
            --parameters file:///tmp/dev-rollout.json \
            --query 'Command.CommandId' --output text)"
          echo "command_id=$id" >> "$GITHUB_OUTPUT"
      - name: Wait until DEV deployment succeeds
        env:
          COMMAND_ID: ${{ steps.rollout.outputs.command_id }}
        run: |
          for i in $(seq 1 180); do
            status="$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id i-0e1aef4dd9cd5ee83 \
              --query Status --output text 2>/dev/null || echo Pending)"
            case "$status" in
              Success) exit 0 ;;
              Failed|Cancelled|TimedOut) echo "DEV backend rollout failed ($status)" >&2; exit 1 ;;
            esac
            sleep 10
          done
          exit 1
      - name: Check DEV API health
        run: curl --fail --silent --show-error --retry 8 --retry-delay 5 --max-time 20 https://api-dev.boscogest.com/healthz

  frontend-deploy:
    needs: [frontend-build, backend-deploy]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: boscogest-development-frontend
          path: dist
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: eu-west-1
          role-to-assume: arn:aws:iam::909186483504:role/BoscoGest-GitHub-Dev-Deployer
          role-session-name: boscogest-dev-front-${{ github.run_id }}
      - name: Publish only to dedicated DEV bucket
        run: |
          aws s3 sync dist/ s3://boscogest-frontend-dev/ --exclude "index.html" --cache-control "public,max-age=300"
          aws s3 cp dist/index.html s3://boscogest-frontend-dev/index.html --content-type "text/html" --cache-control "no-cache,no-store,must-revalidate"
          aws cloudfront create-invalidation --distribution-id E3ADF31ZVJ509O --paths "/*"
      - name: Check DEV site
        run: curl --fail --location --retry 8 --retry-delay 5 --max-time 20 --output /dev/null https://dev.boscogest.com/
