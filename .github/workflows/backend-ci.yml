name: Backend checks

on:
  push:
    branches: [main]
    paths:
      - 'boscoGest-back/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    paths:
      - 'boscoGest-back/**'
      - '.github/workflows/backend-ci.yml'

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend unit tests and lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: boscoGest-back
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: boscoGest-back/requirements.txt
      - run: pip install -r requirements.txt
      - name: Ruff
        run: ruff check app/
      - name: Pytest
        env:
          SECRET_KEY: 'ci-secret-key-of-at-least-thirty-two-characters'
          CORS_ORIGINS: 'http://localhost:4200'
          DATABASE_URL: 'sqlite:///:memory:'
          STORAGE_BACKEND: local
        run: pytest app/tests/ -q

  migrations:
    name: PostgreSQL migration smoke test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: bg
          POSTGRES_PASSWORD: bg
          POSTGRES_DB: boscogest
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: boscoGest-back
    env:
      DATABASE_URL: postgresql+psycopg2://bg:bg@localhost:5432/boscogest
      SECRET_KEY: 'ci-secret-key-of-at-least-thirty-two-characters'
      CORS_ORIGINS: 'http://localhost:4200'
      STORAGE_BACKEND: local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: boscoGest-back/requirements.txt
      - run: pip install -r requirements.txt
      - name: Apply migrations
        run: alembic upgrade head
      - name: Check migration reversibility
        run: |
          alembic downgrade base
          alembic upgrade head

  docker:
    name: Build backend image
    runs-on: ubuntu-latest
    needs: [backend-tests, migrations]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: boscoGest-back
          push: false
          platforms: linux/amd64
          tags: boscogest-back:ci
