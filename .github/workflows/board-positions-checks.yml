name: Board positions checks

on:
  pull_request:
    paths:
      - 'boscoGest-back/app/api/v1/board_position_router.py'
      - 'boscoGest-back/app/models/board_position_model.py'
      - 'boscoGest-back/app/tests/test_board_positions.py'
      - 'boscoGest-back/alembic/versions/*board_positions.py'
      - 'boscoGest-front/src/app/users/**'
      - '.github/workflows/board-positions-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  board-api:
    name: Board appointment access-control regression
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: boscoGest-back
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: boscoGest-back/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m pytest -q app/tests/test_board_positions.py

  board-angular:
    name: Board administration interface compilation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: boscoGest-front
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: boscoGest-front/package-lock.json
      - run: npm ci
      - name: Build against valid production API configuration
        env:
          APP_DOMAIN: boscogest.com
        run: npm run build
