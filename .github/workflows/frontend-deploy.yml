name: Frontend - build and deploy to AWS

on:
  pull_request:
    paths:
      - 'boscoGest-front/**'
      - '.github/workflows/frontend-deploy.yml'
  push:
    branches: [main]
    paths:
      - 'boscoGest-front/**'
      - '.github/workflows/frontend-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: boscogest-frontend-production
  cancel-in-progress: false

jobs:
  build:
    name: Verify and build Angular frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: boscoGest-front
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: boscoGest-front/package-lock.json
      - run: npm ci
      - name: Build against production API
        env:
          APP_DOMAIN: boscogest.com
        run: npm run build
      - name: Check production bundle
        run: |
          test -s dist/boscoGest-front/browser/index.html
          test -n "$(find dist/boscoGest-front/browser -maxdepth 1 -name 'main-*.js' -print -quit)"
          if grep -rE 'http://([0-9]{1,3}\.){3}[0-9]{1,3}' dist/boscoGest-front/browser/*.js; then
            echo 'ERROR: insecure hardcoded IP in production JavaScript' >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: boscogest-frontend-dist
          path: boscoGest-front/dist/boscoGest-front/browser/
          if-no-files-found: error
          retention-days: 14

  deploy:
    name: Publish to S3 and invalidate CloudFront
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    environment: production
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: boscogest-frontend-dist
          path: dist
      - name: Assume narrowly scoped AWS role using GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::909186483504:role/BoscoGest-GitHub-Frontend-Deployer
          role-session-name: boscogest-frontend-${{ github.run_id }}
          aws-region: eu-west-1
      - name: Upload assets without deleting existing hashed bundles
        run: |
          aws s3 sync dist/ s3://boscogest-frontend/ \
            --exclude "index.html" \
            --cache-control "public,max-age=300"
      - name: Publish index only after all assets
        run: |
          aws s3 cp dist/index.html s3://boscogest-frontend/index.html \
            --content-type "text/html" \
            --cache-control "no-cache,no-store,must-revalidate"
      - name: Invalidate CDN
        run: |
          aws cloudfront create-invalidation \
            --distribution-id E34CSQ092X6U3D \
            --paths "/*"
      - name: Verify live website
        run: |
          curl --fail --location --retry 5 --retry-delay 5 \
            --max-time 20 --output /dev/null https://boscogest.com/
