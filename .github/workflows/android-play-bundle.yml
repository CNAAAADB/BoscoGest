name: Android - prepare Google Play bundle

on:
  pull_request:
    paths:
      - '.github/workflows/android-play-bundle.yml'
      - 'boscoGest-front/android/app/build.gradle'
      - 'boscoGest-front/capacitor.config.ts'
  push:
    branches: [main]
    paths:
      - '.github/workflows/android-play-bundle.yml'
      - 'boscoGest-front/android/app/build.gradle'
      - 'boscoGest-front/capacitor.config.ts'
  workflow_dispatch:
    inputs:
      publish_closed:
        description: Publicar en la prueba cerrada de Google Play
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: boscogest-android-bundle-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bundle:
    name: Build Google Play AAB (signed only with existing upload key)
    if: ${{ !inputs.publish_closed || github.ref == 'refs/heads/main' }}
    outputs:
      artifact: ${{ steps.upload.outputs.artifact-id }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: boscoGest-front/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install exact dependencies
        run: npm ci
        working-directory: boscoGest-front

      - name: Build web assets and sync Capacitor Android
        working-directory: boscoGest-front
        env:
          APP_DOMAIN: boscogest.com
        run: |
          set -euo pipefail
          npm run build
          npx cap sync android
          test -f android/app/google-services.json || {
            echo 'Firebase google-services.json is required for push notifications.' >&2
            exit 1
          }

      # The upload key is the one already registered with Google Play.
      # Never generate a new key for an existing Play app.
      - name: Configure existing Play upload key if available
        # Never expose release signing secrets to pull-request build code.
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        id: signing
        env:
          UPLOAD_KEYSTORE_B64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$UPLOAD_KEYSTORE_B64" && -z "$UPLOAD_STORE_PASSWORD" && -z "$UPLOAD_KEY_ALIAS" && -z "$UPLOAD_KEY_PASSWORD" ]]; then
            echo 'All four Play upload signing secrets are missing. Configure the ORIGINAL upload key in repository Actions Secrets before releasing.' >&2
            exit 1
          fi

          if [[ -z "$UPLOAD_KEYSTORE_B64" || -z "$UPLOAD_STORE_PASSWORD" || -z "$UPLOAD_KEY_ALIAS" || -z "$UPLOAD_KEY_PASSWORD" ]]; then
            echo 'Incomplete Play upload signing secrets. Supply all four or none.' >&2
            exit 1
          fi

          keystore="$RUNNER_TEMP/boscogest-play-upload.jks"
          printf '%s' "$UPLOAD_KEYSTORE_B64" | base64 --decode > "$keystore"
          chmod 600 "$keystore"
          # Keep key material outside Git and expose it only to this build.
          {
            printf 'storeFile=%s\n' "$keystore"
            printf 'storePassword=%s\n' "$UPLOAD_STORE_PASSWORD"
            printf 'keyAlias=%s\n' "$UPLOAD_KEY_ALIAS"
            printf 'keyPassword=%s\n' "$UPLOAD_KEY_PASSWORD"
          } > boscoGest-front/android/key.properties
          chmod 600 boscoGest-front/android/key.properties
          echo 'signed=true' >> "$GITHUB_OUTPUT"

      - name: Build Android App Bundle
        working-directory: boscoGest-front/android
        env:
          PUBLISH_CLOSED: ${{ inputs.publish_closed }}
        run: |
          args=()
          if [[ "$PUBLISH_CLOSED" == "true" ]]; then
            args+=("-PplayVersionCode=$((5 + GITHUB_RUN_NUMBER))")
          fi
          ./gradlew bundleRelease --no-daemon "${args[@]}"

      - name: Verify output and signing
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          aab="boscoGest-front/android/app/build/outputs/bundle/release/app-release.aab"
          test -s "$aab"
          if [[ "${{ steps.signing.outputs.signed }}" == 'true' ]]; then
            jarsigner -verify "$aab"
            echo 'bundle_kind=signed' >> "$GITHUB_OUTPUT"
            echo 'Signed Android bundle generated with the configured Play upload key.'
          else
            echo 'bundle_kind=unsigned' >> "$GITHUB_OUTPUT"
            echo 'UNSIGNED Android bundle: not uploadable to Google Play until signed with the existing upload key.'
          fi

      - name: Upload Android bundle artifact
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: boscogest-android-1.2.0-${{ steps.verify.outputs.bundle_kind }}
          path: boscoGest-front/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publicar en la prueba cerrada
    needs: bundle
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.publish_closed
    runs-on: ubuntu-latest
    steps:
      - name: Comprobar configuración de Google Play
        env:
          TRACK: ${{ vars.GOOGLE_PLAY_CLOSED_TRACK }}
          HAS_CREDENTIAL: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON != '' }}
        run: |
          if [[ "$HAS_CREDENTIAL" != "true" ]]; then
            echo "::error::Configura el secreto GOOGLE_PLAY_SERVICE_ACCOUNT_JSON."
            exit 1
          fi
          case "${TRACK,,}" in
            ''|production|beta|open|internal|qa|internalsharing|*:*|*,*|[[:space:]]*|*[[:space:]])
              echo "::error::Configura GOOGLE_PLAY_CLOSED_TRACK con el identificador exacto del canal cerrado de BoscoGest."
              exit 1 ;;
          esac

      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.bundle.outputs.artifact }}
          path: bundle
          merge-multiple: true

      - name: Enviar el bundle firmado a Google Play
        uses: r0adkll/upload-google-play@7f5b759879c088a86faf85d18779f7f14e79a086 # v1.1.4
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.boscogest.app
          releaseFiles: bundle/app-release.aab
          tracks: ${{ vars.GOOGLE_PLAY_CLOSED_TRACK }}
          status: completed
