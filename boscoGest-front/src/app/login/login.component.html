<div class="login-container">
  <mat-card class="login-card">
    <div class="logo-container">
      <img src="assets/images/LogoAAAA.png" alt="BoscoGest Logo" class="login-logo">
    </div>
    <mat-card-header>
      <mat-card-title>BoscoGest</mat-card-title>
      <mat-card-subtitle>Iniciar Sesión</mat-card-subtitle>
    </mat-card-header>
    <mat-card-content>
      <form (ngSubmit)="onLogin()">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Email o teléfono</mat-label>
          <input
            matInput
            type="text"
            [(ngModel)]="identifier"
            name="identifier"
            required
          />
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Contraseña</mat-label>
          <input
            matInput
            type="password"
            [(ngModel)]="password"
            name="password"
            required
          />
        </mat-form-field>

        <a
          class="forgot-link"
          routerLink="/recuperar"
          [state]="{ identifier: identifier() }">
          ¿Has olvidado tu contraseña?
        </a>

        @if (errorMessage()) {
          <div class="error-message">{{ errorMessage() }}</div>
        }

        @if (mobileApp) {
          <mat-checkbox [checked]="enableBiometric()"
                        (change)="enableBiometric.set($event.checked)">
            Usar huella o reconocimiento facial en próximos accesos
          </mat-checkbox>
        }

        <button mat-raised-button color="primary" type="submit" class="full-width login-button">
          Iniciar Sesión
        </button>
      </form>
    </mat-card-content>

    <mat-card-actions class="login-actions">
      <span class="register-link">
        ¿No tienes cuenta? <a routerLink="/register">Regístrate</a>
      </span>
      <!-- Alcanzables sin sesión: es la pantalla en la que aterriza un revisor
           de Google Play, que comprueba ambas páginas antes de aprobar la ficha. -->
      <span class="legal-links">
        <a routerLink="/privacidad">Política de privacidad</a>
        <span aria-hidden="true"> · </span>
        <a routerLink="/eliminar-cuenta">Eliminar cuenta</a>
      </span>
    </mat-card-actions>
  </mat-card>
</div>
