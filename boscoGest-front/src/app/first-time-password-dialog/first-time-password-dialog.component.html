<h2 mat-dialog-title>Cambio de Contraseña Obligatorio</h2>

<mat-dialog-content>
  <p class="info-message">
    Por seguridad, debes cambiar tu contraseña antes de continuar.
  </p>
  <form [formGroup]="changePasswordForm" class="password-form">
    <!-- Nueva Contraseña -->
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Nueva Contraseña</mat-label>
      <input
        matInput
        [type]="hideNewPassword ? 'password' : 'text'"
        formControlName="new_password"
        placeholder="Ingrese su nueva contraseña"
        autocomplete="new-password"
      />
      <button
        mat-icon-button
        matSuffix
        type="button"
        (click)="hideNewPassword = !hideNewPassword"
        [attr.aria-label]="'Mostrar contraseña'"
        [attr.aria-pressed]="!hideNewPassword"
      >
        <mat-icon aria-hidden="true">{{ hideNewPassword ? 'visibility_off' : 'visibility' }}</mat-icon>
      </button>
      <mat-error *ngIf="changePasswordForm.get('new_password')?.invalid">
        {{ getPasswordErrorMessage() }}
      </mat-error>
      <mat-hint>Mínimo 8 caracteres, 1 mayúscula y 1 número</mat-hint>
    </mat-form-field>

    <!-- Confirmar Nueva Contraseña -->
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Confirmar Nueva Contraseña</mat-label>
      <input
        matInput
        [type]="hideConfirmPassword ? 'password' : 'text'"
        formControlName="confirm_password"
        placeholder="Confirme su nueva contraseña"
        autocomplete="new-password"
      />
      <button
        mat-icon-button
        matSuffix
        type="button"
        (click)="hideConfirmPassword = !hideConfirmPassword"
        [attr.aria-label]="'Mostrar contraseña'"
        [attr.aria-pressed]="!hideConfirmPassword"
      >
        <mat-icon aria-hidden="true">{{ hideConfirmPassword ? 'visibility_off' : 'visibility' }}</mat-icon>
      </button>
      <mat-error *ngIf="changePasswordForm.get('confirm_password')?.invalid || changePasswordForm.hasError('passwordMismatch')">
        {{ getConfirmPasswordErrorMessage() }}
      </mat-error>
    </mat-form-field>
  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button
    mat-raised-button
    color="primary"
    (click)="onSubmit()"
    [disabled]="changePasswordForm.invalid || isSubmitting()"
  >
    {{ isSubmitting() ? 'Cambiando...' : 'Cambiar Contraseña' }}
  </button>
</mat-dialog-actions>
