<h2 mat-dialog-title>Cambiar Contraseña</h2>

<mat-dialog-content>
  <form [formGroup]="changePasswordForm" class="password-form">
    <!-- Contraseña Actual -->
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Contraseña Actual</mat-label>
      <input
        matInput
        [type]="hideCurrentPassword ? 'password' : 'text'"
        formControlName="current_password"
        placeholder="Ingrese su contraseña actual"
        autocomplete="current-password"
      />
      <button
        mat-icon-button
        matSuffix
        type="button"
        (click)="hideCurrentPassword = !hideCurrentPassword"
        [attr.aria-label]="'Mostrar contraseña'"
        [attr.aria-pressed]="!hideCurrentPassword"
      >
        <mat-icon>{{ hideCurrentPassword ? 'visibility_off' : 'visibility' }}</mat-icon>
      </button>
      <mat-error *ngIf="changePasswordForm.get('current_password')?.hasError('required')">
        La contraseña actual es requerida
      </mat-error>
    </mat-form-field>

    <!-- Nueva Contraseña -->
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Nueva Contraseña</mat-label>
      <input
        matInput
        [type]="hideNewPassword ? 'password' : 'text'"
        formControlName="new_password"
        placeholder="Ingrese su nueva contraseña"
        autocomplete="new-password"
      />
      <button
        mat-icon-button
        matSuffix
        type="button"
        (click)="hideNewPassword = !hideNewPassword"
        [attr.aria-label]="'Mostrar contraseña'"
        [attr.aria-pressed]="!hideNewPassword"
      >
        <mat-icon>{{ hideNewPassword ? 'visibility_off' : 'visibility' }}</mat-icon>
      </button>
      <mat-error *ngIf="changePasswordForm.get('new_password')?.invalid">
        {{ getPasswordErrorMessage() }}
      </mat-error>
      <mat-hint>Mínimo 8 caracteres, 1 mayúscula y 1 número</mat-hint>
    </mat-form-field>

    <!-- Confirmar Nueva Contraseña -->
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Confirmar Nueva Contraseña</mat-label>
      <input
        matInput
        [type]="hideConfirmPassword ? 'password' : 'text'"
        formControlName="confirm_password"
        placeholder="Confirme su nueva contraseña"
        autocomplete="new-password"
      />
      <button
        mat-icon-button
        matSuffix
        type="button"
        (click)="hideConfirmPassword = !hideConfirmPassword"
        [attr.aria-label]="'Mostrar contraseña'"
        [attr.aria-pressed]="!hideConfirmPassword"
      >
        <mat-icon>{{ hideConfirmPassword ? 'visibility_off' : 'visibility' }}</mat-icon>
      </button>
      <mat-error *ngIf="changePasswordForm.get('confirm_password')?.invalid || changePasswordForm.hasError('passwordMismatch')">
        {{ getConfirmPasswordErrorMessage() }}
      </mat-error>
    </mat-form-field>
  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button (click)="onCancel()" [disabled]="isSubmitting">
    Cancelar
  </button>
  <button
    mat-raised-button
    color="primary"
    (click)="onSubmit()"
    [disabled]="changePasswordForm.invalid || isSubmitting"
  >
    {{ isSubmitting ? 'Cambiando...' : 'Cambiar Contraseña' }}
  </button>
</mat-dialog-actions>
